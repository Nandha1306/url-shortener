services:

  mysql:
    image: mysql:8.0
    environment:
#      MYSQL_ROOT_PASSWORD: password
#      MYSQL_DATABASE: url_shortener
      MYSQL_DATABASE: ${DB_NAME:-url_shortener}
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql_data: